<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同审核 + 财务收票 · AI Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6}
.top-bar{background:#1d1d1f;color:#fff;padding:10px 24px;display:flex;align-items:center;gap:16px;font-size:13px}
.top-bar .dot{width:8px;height:8px;border-radius:50%;background:#34c759}
.top-bar .title{font-weight:600;font-size:15px}
.container{max-width:1300px;margin:0 auto;padding:20px 24px}

.hero{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;border-radius:14px;padding:24px 28px;margin-bottom:20px}
.hero h1{font-size:24px;font-weight:700;margin-bottom:6px}
.hero .sub{color:#a8b9d4;font-size:13px}
.metrics{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.metric{background:rgba(255,255,255,.08);border-radius:10px;padding:12px 16px;min-width:140px}
.metric .val{font-size:28px;font-weight:700}
.metric .val.gold{color:#e4b363}
.metric .label{font-size:11px;color:#a8b9d4;margin-top:2px}

.process-tabs{display:flex;gap:4px;margin-bottom:14px;background:#e8e8ed;border-radius:10px;padding:4px;width:fit-content}
.process-tab{text-align:center;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s;border:none;background:transparent;color:#666}
.process-tab.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.process-tab .savings{font-size:10px;color:#34c759;display:block;font-weight:400;margin-top:2px}

.phase-tabs{display:flex;gap:4px;margin-bottom:16px;background:#e8e8ed;border-radius:10px;padding:4px}
.phase-tab{flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;transition:.2s;border:none;background:transparent;color:#666}
.phase-tab.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.phase-tab .badge{display:inline-block;font-size:9px;padding:2px 5px;border-radius:6px;margin-left:4px;vertical-align:middle}
.badge-ai{background:#007aff;color:#fff}
.badge-human{background:#8e8e93;color:#fff}

.flow{display:flex;align-items:flex-start;gap:0;margin-bottom:16px;background:#fff;border-radius:14px;padding:20px 16px;overflow-x:auto}
.flow-step{text-align:center;min-width:100px;flex:1;position:relative;cursor:pointer;transition:.15s;padding:6px;border-radius:10px}
.flow-step:hover{background:#f0f0f5}
.flow-step.active-step{background:#e3f0ff;box-shadow:0 0 0 2px #007aff}
.flow-step.locked{opacity:.4;cursor:default}
.flow-step .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:20px}
.icon-human{background:#f2f2f7}
.icon-ai{background:#e3f0ff}
.icon-upload{background:#e8f5e9}
.icon-download{background:#fff3e0}
.flow-step .step-title{font-size:11px;font-weight:600;margin-bottom:2px}
.flow-step .step-who{font-size:9px;color:#8e8e93}
.flow-step .step-who.ai{color:#007aff}
.flow-arrow{display:flex;align-items:center;justify-content:center;width:32px;min-width:32px;font-size:14px;color:#c7c7cc;padding-top:12px}

.time-bar{background:#fff;border-radius:14px;padding:16px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.time-bar .time-block{flex:1;min-width:180px;text-align:center}
.time-bar .time-block .big{font-size:22px;font-weight:700}
.time-bar .time-block .big.red{color:#c0392b}
.time-bar .time-block .big.green{color:#27ae60}
.time-bar .time-block .desc{font-size:10px;color:#8e8e93;margin-top:2px}
.time-bar .arrow-big{font-size:24px;color:#8e8e93}

.main-panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.main-panels.single{grid-template-columns:1fr}
.panel{background:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column}
.panel h3{font-size:15px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px}
.panel .dl-btn{margin-left:auto;font-size:10px;padding:4px 10px;border:1px solid #007aff;color:#007aff;background:#fff;border-radius:6px;cursor:pointer}
.panel .dl-btn:hover{background:#007aff;color:#fff}
.panel .dl-btn.locked{opacity:.3;cursor:not-allowed;border-color:#c7c7cc;color:#c7c7cc}
.panel .dl-btn.locked:hover{background:#fff;color:#c7c7cc}
.scroll-body{overflow-y:auto;max-height:420px;flex:1}

.risk-table{width:100%;border-collapse:collapse;font-size:11px}
.risk-table th{text-align:left;padding:6px 5px;color:#8e8e93;font-weight:500;font-size:10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff;z-index:1}
.risk-table td{padding:7px 5px;border-bottom:1px solid #f8f8f8;vertical-align:top}
.risk-table tr:hover{background:#fafafc}
.risk-badge{display:inline-block;padding:2px 6px;border-radius:6px;font-size:9px;font-weight:600}
.risk-high{background:#ffe5e5;color:#c0392b}
.risk-mid{background:#fff3e0;color:#e67e22}
.risk-low{background:#e8f5e9;color:#27ae60}
.risk-ok{background:#e3f0ff;color:#007aff}
.risk-na{background:#f2f2f7;color:#8e8e93}

.feedback-row{display:flex;align-items:center;gap:5px;margin-top:3px}
.fb-btn{border:1px solid #e0e0e0;background:#fff;padding:2px 7px;border-radius:6px;font-size:9px;cursor:pointer;transition:.15s}
.fb-btn:hover{border-color:#007aff;color:#007aff}
.fb-form{display:none;margin-top:4px;flex-direction:column;gap:4px}
.fb-form textarea{width:100%;padding:6px;border:1px solid #e0e0e0;border-radius:6px;font-size:10px;resize:vertical;font-family:inherit}
.fb-form button{padding:4px 12px;background:#007aff;color:#fff;border:none;border-radius:6px;font-size:10px;cursor:pointer;align-self:flex-end}
.eval-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;display:none;z-index:999;animation:fadeUp .3s}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.ledger-table{width:100%;border-collapse:collapse;font-size:11px}
.ledger-table th,.ledger-table td{padding:7px;text-align:left;border-bottom:1px solid #f0f0f0}
.ledger-table th{color:#8e8e93;font-weight:500;font-size:10px}
.ledger-new{animation:highlight 2s ease}
@keyframes highlight{0%{background:#e3f0ff}100%{background:transparent}}

.comm-box,.email-box{background:#f8f9fa;border-radius:10px;padding:14px;font-size:12px;line-height:1.7}
.comm-msg{margin-bottom:7px;display:flex;gap:8px;align-items:flex-start}
.comm-msg .avatar{width:24px;height:24px;border-radius:50%;background:#007aff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.comm-msg .avatar.gray{background:#8e8e93}
.comm-msg .bubble{background:#fff;padding:7px 10px;border-radius:10px;max-width:85%}
.email-header{color:#8e8e93;margin-bottom:8px}
.diff{background:#fff3e0;padding:5px 10px;border-radius:6px;margin:5px 0;font-size:10px}

.scorecard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.score-item{text-align:center;padding:10px;border-radius:10px;background:#f8f9fa}
.score-item .num{font-size:22px;font-weight:700}
.score-item .lbl{font-size:9px;color:#8e8e93;margin-top:2px}

.bill-compare{margin-top:14px}
.bill-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:11px;gap:10px}
.bill-row>span{flex:1}
.bill-row .match{color:#27ae60}
.bill-row .diff-bill{color:#c0392b}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:32px;max-width:480px;width:90%;text-align:center}
.modal h2{font-size:18px;margin-bottom:12px}
.modal .phone-frame{background:#1d1d1f;border-radius:20px;padding:16px 10px 10px;width:240px;margin:0 auto 16px}
.modal .phone-screen{background:#fff;border-radius:8px;padding:20px 14px;min-height:260px;position:relative}
.modal .phone-notch{width:60px;height:6px;background:#333;border-radius:3px;margin:0 auto 8px}
.modal .phone-app{font-size:13px;color:#8e8e93;margin-bottom:8px}
.modal .phone-upload{background:#e3f0ff;border:2px dashed #007aff;border-radius:10px;padding:20px;margin:10px 0;font-size:32px;cursor:default;transition:.3s}
.modal .phone-upload.anim{background:#e8f5e9;border-color:#27ae60;animation:pulse .6s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.modal .progress-bar{width:100%;height:4px;background:#f0f0f0;border-radius:2px;margin-top:10px;overflow:hidden}
.modal .progress-fill{height:100%;background:#007aff;border-radius:2px;width:0;transition:width .8s}
.modal .done-text{font-size:12px;color:#27ae60;margin-top:8px;display:none}
.modal button{padding:8px 24px;border-radius:8px;border:none;cursor:pointer;font-size:13px;margin-top:12px}
.modal .btn-primary{background:#007aff;color:#fff}
.modal .btn-close{background:#f2f2f7;color:#666;margin-left:8px}

@media(max-width:768px){
  .main-panels{grid-template-columns:1fr}
  .flow{flex-wrap:wrap;gap:8px}
  .flow-arrow{display:none}
  .time-bar{flex-direction:column;gap:8px}
  .time-bar .arrow-big{transform:rotate(90deg)}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="dot"></div>
  <div class="title">Amer Sports · AI 智能助手</div>
  <span style="margin-left:auto;color:#8e8e93">Demo v1.2</span>
</div>

<div class="container">

<div class="hero">
  <h1>AI 合同审核 + 财务收票</h1>
  <div class="sub">26 份/月 · 185 店 → 年底 310 店 · 两流程并行</div>
  <div class="metrics">
    <div class="metric"><div class="val gold">26</div><div class="label">份/月 · 合同量</div></div>
    <div class="metric"><div class="val gold">185→310</div><div class="label">门店数</div></div>
    <div class="metric"><div class="val gold">¥120</div><div class="label">人力成本 元/h</div></div>
    <div class="metric"><div class="val gold">¥34.8万</div><div class="label">全年预估</div></div>
  </div>
</div>

<div class="process-tabs" id="processTabs">
  <button class="process-tab active" data-process="contract">
    审核合同<span class="savings" id="contractSavings"></span>
  </button>
  <button class="process-tab" data-process="finance">
    财务收票付款<span class="savings" id="financeSavings"></span>
  </button>
</div>

<div class="time-bar" id="timeBar"></div>

<div class="phase-tabs" id="phaseTabs">
  <button class="phase-tab active" data-phase="1">阶段一&nbsp;<span class="badge badge-human">人工协作</span></button>
  <button class="phase-tab" data-phase="2">阶段二&nbsp;<span class="badge badge-ai">AI辅助</span></button>
  <button class="phase-tab" data-phase="3">阶段三&nbsp;<span class="badge badge-ai">AI自主</span></button>
</div>

<div class="flow" id="flow"></div>

<div class="main-panels" id="mainPanels">
  <div class="panel" id="leftPanel"></div>
  <div class="panel" id="rightPanel"></div>
</div>

</div>

<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2>📱 小A智能助手 · 上传合同</h2>
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="phone-notch"></div>
        <div class="phone-app">小A智能助手</div>
        <div class="phone-upload" id="phoneUpload">📄<br><span style="font-size:11px;display:block;margin-top:4px">点击上传合同</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="done-text" id="doneText">✅ 合同已上传 · AI审核中...</div>
      </div>
    </div>
    <button class="btn-primary" onclick="simulateUpload()">模拟上传</button>
    <button class="btn-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<div class="eval-toast" id="evalToast"></div>

<script>
// === STATE ===
let currentProcess = 'contract';
let currentPhase = 1;
let auditComplete = false;
let ledgerShown = false;
let confirmedRisks = {};

// === TIME DATA ===
const timeData = {
  contract:{ current:2.25, ai:0.5, monthly:26 },
  finance:{ current:1.0, ai:0.25, monthly:26 }
};

function getTimeStr(td){
  const curTotal = td.current * td.monthly;
  const aiTotal = td.ai * td.monthly;
  const saved = curTotal - aiTotal;
  return {curMonthly:curTotal,aiMonthly:aiTotal,savedMonthly:saved,savedYearly:saved*12};
}

function renderTimeBar(){
  const td = timeData[currentProcess];
  const t = getTimeStr(td);
  const label = currentProcess==='contract'?'审核合同':'财务收票';
  document.getElementById('timeBar').innerHTML = `
    <div class="time-block">
      <div class="desc">当前 · 单份${label}耗时</div>
      <div class="big red">${td.current} 小时</div>
      <div class="desc">月累计 ${t.curMonthly.toFixed(1)}h · 年 ${(t.curMonthly*12).toFixed(0)}h</div>
    </div>
    <div class="arrow-big">→</div>
    <div class="time-block">
      <div class="desc">AI 辅助后 · 单份耗时</div>
      <div class="big green">${td.ai} 小时</div>
      <div class="desc">月累计 ${t.aiMonthly.toFixed(1)}h</div>
    </div>
    <div class="arrow-big">=</div>
    <div class="time-block">
      <div class="desc">月节省</div>
      <div class="big green">${t.savedMonthly.toFixed(1)} 小时</div>
      <div class="desc">年节省 ${t.savedYearly.toFixed(0)}h · ¥${(t.savedYearly*120).toLocaleString()}</div>
    </div>
  `;
}

function renderSavingsLabels(){
  const ct = getTimeStr(timeData.contract);
  const ft = getTimeStr(timeData.finance);
  document.getElementById('contractSavings').textContent = `月省 ${ct.savedMonthly.toFixed(1)}h`;
  document.getElementById('financeSavings').textContent = `月省 ${ft.savedMonthly.toFixed(1)}h`;
}

// === AUDIT DATA ===
const auditData = [
  {id:1,cat:"法律/商业",point:"签约主体及品牌",result:"甲方：上海毅朗商业有限公司；乙方：亚玛芬商业（上海）有限公司；品牌：SALOMON。签约主体清晰。",src:"合同首部 · 甲乙方信息栏",opinion:"合规",risk:"ok"},
  {id:2,cat:"商业",point:"合作模式",result:"联营合同（联合销售经营模式 简化版）。甲方提供场地+POS，乙方经营；甲方先收全部货款再结算。",src:"封面 · 第5条",opinion:"合规 · 需核对报店签批",risk:"ok"},
  {id:3,cat:"期限",point:"合同期限",result:"租期3年，自交付日起算。免租期30天。起始日待定（交付日不确定）。",src:"Part 1 · 主要商业条款",opinion:"中风险 · 起始日不明确",risk:"mid"},
  {id:4,cat:"财务",point:"租赁面积",result:"167㎡（约）。合同注明'以甲方最终核实为准'——面积单方调整风险。",src:"Part 1 · 场地",opinion:"中风险 · 面积待确认",risk:"mid"},
  {id:5,cat:"财务",point:"租金/提成及管费/推广费/税率 VS 报店文件",result:"Y1保底¥76,542/月（¥5,500/㎡/年），Y2 ¥80,717，Y3 ¥83,500；提成Y1-2: 13%, Y3: 14%。取保底与提成较高者——单向棘轮。",src:"Part 1 · 商业条款表",opinion:"高风险 · 单向棘轮+未核对报店",risk:"high"},
  {id:6,cat:"财务",point:"最低营业额承诺",result:"¥7,515,000/年（¥45,000/㎡/年）。连续12个月不达标甲方可单方终止。",src:"Part 1 · 第21条",opinion:"高风险 · 门槛高+终止权",risk:"high"},
  {id:7,cat:"财务/运营",point:"保证金与押金",result:"保证金¥295,590（3个月保底+3个月服务费）。解约即没收全部保证金——无司法审查前置。",src:"Part 1 · 第6/15条",opinion:"高风险 · 解约即没收",risk:"high"},
  {id:8,cat:"商业",point:"联营压货款",result:"联营模式适用，合同未明确最后一个月货款压款条款。",src:"（缺失）",opinion:"中风险 · 压货款条款缺失",risk:"mid"},
  {id:9,cat:"结算/运营",point:"账单出具日/付款周期/滞纳金",result:"次月第20个工作日结算——最长50+自然日占用。缺滞纳金条款。",src:"第5条",opinion:"中风险 · 周期长+缺滞纳金",risk:"mid"},
  {id:10,cat:"财务",point:"货款结算及延期回款滞纳金",result:"商场收银。甲方控制全部现金流，乙方零杠杆。延迟结算无罚则。",src:"第5条",opinion:"高风险 · 现金流单方控制",risk:"high"},
  {id:11,cat:"终止后",point:"证照注销期约定",result:"未明确约定。标准要求≤45天。",src:"（缺失）",opinion:"低风险 · 证照注销期缺失",risk:"low"},
  {id:12,cat:"合规",point:"营业额审计报告约定",result:"未约定。标准：次年5月31日前。",src:"（缺失）",opinion:"低风险 · 审计报告缺失",risk:"low"},
  {id:13,cat:"运营",point:"收银方式",result:"商场统一收银。甲方POS系统。",src:"第5/13条",opinion:"合规",risk:"ok"},
  {id:14,cat:"财务",point:"收银手续费率",result:"POS¥700/台/月。手续费率未单独列。",src:"Part 1",opinion:"低风险 · 需确认",risk:"low"},
  {id:15,cat:"商业",point:"会员卡折扣/积分",result:"需接受甲方礼品卡及会员卡规则。手续/折扣由甲方单方调整。",src:"第8条 · 附件五、六",opinion:"中风险 · 甲方单方调整权",risk:"mid"},
  {id:16,cat:"运营",point:"对账人联系方式/电子化",result:"未列明双方对账人姓名、电话、邮箱。",src:"（缺失）",opinion:"低风险 · 对账信息缺失",risk:"low"},
  {id:17,cat:"期限",point:"续约选择",result:"到期前3-6个月书面申请。甲方无义务同意。无优先续租权。",src:"Part 3 · 特别条款",opinion:"中风险 · 无优先续约权",risk:"mid"},
  {id:18,cat:"运营",point:"外仓合同",result:"不适用。",src:"N/A",opinion:"不适用",risk:"na"},
  {id:19,cat:"兜底",point:"其他注意事项",result:"①甲方可单方调费②可单方搬迁店铺（3个月通知，不回复=默认同意）③合同注明'简化版'④签署日期空白",src:"第7.3/16.4条 · 封面",opinion:"高风险 · 多重单方权利",risk:"high"}
];
const riskLabels = {high:"高风险",mid:"中风险",low:"低风险",ok:"合规",na:"不适用"};

// === FLOW ===
function renderFlow(){
  document.getElementById('flow').innerHTML = '';
  let steps;
  if(currentProcess === 'contract'){
    const phases = {
      1:[
        {icon:"📱",title:"上传合同",who:"小A·财务上传",type:"upload",clickable:true},
        {icon:"🔍",title:"AI审核",who:"AI出具报告",type:"ai"},
        {icon:"💬",title:"沟通",who:"财务⇄BD人工沟通",type:"human"},
        {icon:"✅",title:"确认合同",who:"财务确认",type:"human"},
        {icon:"📊",title:"输出台账",who:"AI输出台账",type:"download",locked:!ledgerShown}
      ],
      2:[
        {icon:"📱",title:"上传合同",who:"小A·财务上传",type:"upload",clickable:true},
        {icon:"🔍",title:"AI审核",who:"AI出具报告",type:"ai"},
        {icon:"💬",title:"AI沟通",who:"AI比对+起草邮件",type:"ai"},
        {icon:"✅",title:"确认合同",who:"财务确认",type:"human"},
        {icon:"📊",title:"输出台账",who:"AI输出台账",type:"download",locked:!ledgerShown}
      ],
      3:[
        {icon:"📱",title:"上传合同",who:"小A·BD上传",type:"upload",clickable:true},
        {icon:"🔍",title:"AI审核",who:"AI出具报告",type:"ai"},
        {icon:"💬",title:"AI沟通",who:"AI比对+起草邮件",type:"ai"},
        {icon:"✅",title:"确认合同",who:"财务确认",type:"human"},
        {icon:"📊",title:"台账+账单",who:"AI台账+账单比对",type:"download",locked:!ledgerShown}
      ]
    };
    steps = phases[currentPhase];
  } else {
    steps = [
      {icon:"📱",title:"上传账单",who:"小A·财务上传",type:"upload",clickable:true},
      {icon:"📋",title:"AI解析",who:"AI提取账单明细",type:"ai"},
      {icon:"🔍",title:"AI比对",who:"AI vs 合同条款",type:"ai"},
      {icon:"⚠️",title:"差异标记",who:"差异自动高亮",type:"ai"},
      {icon:"✅",title:"确认付款",who:"财务确认→付款",type:"human"}
    ];
  }
  let html = '';
  steps.forEach((s,i) => {
    const cls = s.locked ? 'locked' : (s.clickable ? '' : '');
    html += `<div class="flow-step ${cls}" ${s.clickable?`onclick="openUploadModal()" title="点击查看小A上传"`:''} data-step="${i}">
      <div class="icon icon-${s.type}">${s.icon}</div>
      <div class="step-title">${s.title}</div>
      <div class="step-who ${s.type==='ai'?'ai':''}">${s.who}</div>
    </div>`;
    if(i < steps.length-1) html += `<div class="flow-arrow">→</div>`;
  });
  document.getElementById('flow').innerHTML = html;
}

// === UPLOAD MODAL ===
function openUploadModal(){
  document.getElementById('uploadModal').classList.add('show');
  document.getElementById('phoneUpload').classList.remove('anim');
  document.getElementById('progressFill').style.width = '0';
  document.getElementById('doneText').style.display = 'none';
}
function closeModal(){
  document.getElementById('uploadModal').classList.remove('show');
}
function simulateUpload(){
  const upload = document.getElementById('phoneUpload');
  if(upload.classList.contains('anim')) return;
  upload.classList.add('anim');
  document.getElementById('progressFill').style.width = '100%';
  setTimeout(()=>{
    document.getElementById('doneText').style.display = 'block';
    if(currentProcess === 'contract' && !auditComplete){
      auditComplete = true;
      toast('📋 AI审核完成！19维度审核报告已生成。点击右侧"确认合同"后输出台账。');
      renderFlow();
      renderAudit();
    }
  },900);
}

// === AUDIT REPORT ===
function renderAudit(){
  const riskCounts = {high:0,mid:0,low:0,ok:0,na:0};

  const applicable = 19 - riskCounts.na;
  const rate = Math.round(riskCounts.ok/applicable*100);
  const rating = riskCounts.high ? '高风险⚠️' : (rate>=70?'良好':'需关注');
  const dlCls = auditComplete ? '' : 'locked';
  const dlTitle = auditComplete ? '下载审核报告 PDF' : '审核完成后可下载';

  document.getElementById('leftPanel').innerHTML = `
    <h3>📋 AI 审核报告 · 19维审核
      <button class="dl-btn ${dlCls}" title="${dlTitle}" onclick="downloadReport()" ${auditComplete?'':'disabled'}>⬇ 下载报告</button>
    </h3>
    <div class="scorecard">
      <div class="score-item"><div class="num" style="color:#007aff">${rate}%</div><div class="lbl">合规率 (${riskCounts.ok}/${applicable})</div></div>
      <div class="score-item"><div class="num" style="color:#c0392b">${riskCounts.high}</div><div class="lbl">高风险项</div></div>
      <div class="score-item"><div class="num" style="color:#1d1d1f">${rating}</div><div class="lbl">综合评级</div></div>
    </div>
    <div class="scroll-body">
      <table class="risk-table"><thead><tr><th>#</th><th>审核要点</th><th>提取结果</th><th>评级</th><th>反馈</th></tr></thead><tbody>
      ${auditData.map(d => {
        const fbId = `fb_${d.id}`;
        const confirmed = confirmedRisks[fbId];
        return `<tr>
          <td style="color:#8e8e93">${d.id}</td>
          <td><strong>${d.point}</strong><br><span style="font-size:9px;color:#8e8e93">${d.cat}</span></td>
          <td>${d.result}<br><span style="font-size:8px;color:#8e8e93;background:#f8f8f8;padding:1px 3px;border-radius:3px">原文: ${d.src}</span></td>
          <td><span class="risk-badge risk-${d.risk}">${riskLabels[d.risk]}</span></td>
          <td>
            <div class="feedback-row" id="row_${fbId}">
              ${confirmed ? `<span class="risk-badge risk-ok">✓ Eval #${Math.floor(Math.random()*900+100)}</span>` : `
              <button class="fb-btn" onclick="confirmRight(${d.id})">✓ 对了</button>
              <button class="fb-btn" onclick="toggleFeedback(${d.id})">✗ 错了</button>`}
            </div>
            <div class="fb-form" id="form_${fbId}">
              <textarea placeholder="正确答案是什么？" id="ta_correct_${d.id}" rows="2"></textarea>
              <textarea placeholder="为什么判错？" id="ta_reason_${d.id}" rows="2"></textarea>
              <button onclick="submitFeedback(${d.id})">提交 → 入 Eval</button>
            </div>
          </td>
        </tr>`;
      }).join('')}
      </tbody></table>
    </div>`;
}

// === FEEDBACK ===
function confirmRight(id){
  confirmedRisks[`fb_${id}`] = true;
  const evalId = Math.floor(Math.random()*900+100);
  document.getElementById(`row_fb_${id}`).innerHTML = `<span class="risk-badge risk-ok">✓ Eval #${evalId}</span>`;
  toast(`✅ Eval #${evalId} · 正例`);
}
function toggleFeedback(id){
  const f = document.getElementById(`form_fb_${id}`);
  f.style.display = f.style.display === 'flex' ? 'none' : 'flex';
}
function submitFeedback(id){
  const correct = document.getElementById(`ta_correct_${id}`).value.trim();
  const reason = document.getElementById(`ta_reason_${id}`).value.trim();
  if(!correct || !reason){ toast('请填写正确答案和判错原因'); return; }
  const evalId = Math.floor(Math.random()*900+100);
  confirmedRisks[`fb_${id}`] = true;
  document.getElementById(`row_fb_${id}`).innerHTML = `<span class="risk-badge risk-ok">✓ Eval #${evalId}</span>`;
  document.getElementById(`form_fb_${id}`).style.display = 'none';
  toast(`✅ Eval #${evalId}<br>期望=${correct.slice(0,30)}… · 原因=${reason.slice(0,30)}…`);
}
function toast(msg){
  const t = document.getElementById('evalToast');
  t.innerHTML = msg;
  t.style.display = 'block';
  setTimeout(()=>{t.style.display='none'},3000);
}

// === TAB HANDLERS ===
document.getElementById('processTabs').addEventListener('click', e => {
  const tab = e.target.closest('.process-tab');
  if(!tab) return;
  currentProcess = tab.dataset.process;
  document.querySelectorAll('.process-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.phase-tab').forEach((t,i) => t.classList.toggle('active', i===0));
  currentPhase = 1;
  if(currentProcess === 'finance'){
    auditComplete = true;
    ledgerShown = true;
  } else {
    auditComplete = false;
    ledgerShown = false;
  }
  renderTimeBar();
  renderAll();
});

document.getElementById('phaseTabs').addEventListener('click', e => {
  const tab = e.target.closest('.phase-tab');
  if(!tab || currentProcess !== 'contract') return;
  currentPhase = parseInt(tab.dataset.phase);
  document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  renderAll();
});

function renderAll(){
  renderFlow();
  if(currentProcess === 'contract'){
    renderAudit();
  }
  renderRight();
}
